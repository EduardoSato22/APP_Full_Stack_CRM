spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.h2.console.enabled=false

cors.allowed.origins=https://retailflow-front.vercel.app,https://retailflow-front-my-projects-sato.vercel.app,http://localhost:5173,http://localhost:3000

logging.level.root=WARN
logging.level.com.retailflow=INFO

# Redis / Cache
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=300s
spring.cache.redis.cache-null-values=false

# Upload — filesystem efêmero no Render; use UPLOAD_DIR apontando para volume persistente ou Cloudinary em prod
upload.dir=${UPLOAD_DIR:uploads}