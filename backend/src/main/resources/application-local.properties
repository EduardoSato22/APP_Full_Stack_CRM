# Banco H2
spring.datasource.url=jdbc:h2:mem:retailflowdb;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Flyway desabilitado no local (H2 + ddl-auto gerencia o schema)
spring.flyway.enabled=false

# Seed via DemoDataLoader; data.sql desabilitado
spring.sql.init.mode=never

# CORS dev
cors.allowed.origins=http://localhost:5173,http://localhost:3000

# OAuth2 redirect — local aponta para dev server
frontend.url=http://localhost:5173

# Cache — sem Redis no perfil local
spring.cache.type=simple

JWT_SECRET=3cfa3dd9a5a3a93010b98f7362f74154153094c962b1a03f4f1342674256425

# Email — Mailtrap dev (configure via .env ou variáveis de ambiente)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@retailflow.dev}

# Desabilita envio real em local quando credenciais nao configuradas
spring.mail.test-connection=false