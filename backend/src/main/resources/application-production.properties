spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Render fica atrás de proxy reverso — necessário para redirect_uri com https:// no OAuth2
server.forward-headers-strategy=framework

# Hikari — evita conexoes stale apos idle no Render/Supabase
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.h2.console.enabled=false

cors.allowed.origins=https://retailflow-front.vercel.app,https://retailflow-front-my-projects-sato.vercel.app,http://localhost:5173,http://localhost:3000

logging.level.root=WARN
logging.level.com.retailflow=INFO

# Cache — usa in-memory (sem Redis externo no Render)
spring.cache.type=simple

# Upload — filesystem efêmero no Render; use UPLOAD_DIR apontando para volume persistente ou Cloudinary em prod
upload.dir=${UPLOAD_DIR:uploads}

# Email — SendGrid/Resend via SMTP (configure via variáveis de ambiente no Render)
spring.mail.host=${MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:apikey}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.mail.from=${MAIL_FROM:noreply@retailflow.dev}

# Desabilita health checks de serviços opcionais — evita 135s de bloqueio no /actuator/health
management.health.mail.enabled=false
management.health.redis.enabled=false