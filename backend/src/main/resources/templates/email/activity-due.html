<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade Pendente</title>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .header { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%); padding: 32px; text-align: center; }
    .header h1 { color: #fff; margin: 0; font-size: 24px; font-weight: 700; }
    .body { padding: 32px; }
    .body h2 { color: #1a1a2e; margin: 0 0 16px; }
    .alert-box { background: #fff8e1; border-left: 4px solid #f59e0b; border-radius: 4px; padding: 16px 20px; margin-bottom: 24px; }
    .alert-box strong { color: #b45309; display: block; margin-bottom: 4px; }
    .alert-box span { color: #78350f; }
    .body p { color: #555; line-height: 1.6; }
    .footer { background: #f5f5f5; padding: 20px 32px; text-align: center; color: #999; font-size: 13px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⏰ Atividade Pendente</h1>
  </div>
  <div class="body">
    <h2>Olá, <span th:text="${userName}">Usuário</span>!</h2>
    <p>Você tem uma atividade com prazo próximo:</p>
    <div class="alert-box">
      <strong th:text="${activityTitle}">Título da Atividade</strong>
      <span>Prazo: <span th:text="${#temporals.format(dueDate, 'dd/MM/yyyy HH:mm')}">—</span></span>
    </div>
    <p>Acesse o RetailFlow CRM para verificar e atualizar o status desta atividade.</p>
  </div>
  <div class="footer">
    <p>RetailFlow CRM — Notificação automática</p>
  </div>
</div>
</body>
</html>
