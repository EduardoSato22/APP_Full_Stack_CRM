services:
  - type: web
    name: retailflow-backend
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/taskflow-api-1.0.0.jar --spring.profiles.active=production
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

