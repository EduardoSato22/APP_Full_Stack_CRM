name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # toda segunda às 06:00 UTC

jobs:
  owasp-dependency-check:
    name: OWASP Dependency Check (Backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        working-directory: backend
        run: |
          mvn dependency-check:check \
            -B \
            -Ddependency-check.failBuildOnCVSS=9 \
            -Ddependency-check.suppressionFile=.owasp-suppression.xml \
            --no-transfer-progress || true
        env:
          JWT_SECRET: ci-placeholder

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html
          retention-days: 30
          if-no-files-found: warn

  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy scan (filesystem)
        run: |
          trivy fs \
            --format sarif \
            --output trivy-fs.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            .
        continue-on-error: true

      - name: Ensure SARIF exists
        if: always()
        run: |
          if [ ! -f trivy-fs.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]}' > trivy-fs.sarif
          fi

      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
